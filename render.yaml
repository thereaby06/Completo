services:
  # Backend Service
  - type: web
    name: workshop-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && cd backend && npm install && npx prisma generate
    preDeployCommand: cd backend && node prisma/setup-db.js
    startCommand: cd backend && node src/index.js
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: DATABASE_URL
        fromDatabase:
          name: completo-db
          property: internalConnectionString
      - key: JWT_SECRET
        generateValue: true # Genera un secret seguro automáticamente
      - key: PORT
        value: 10000
      - key: RESET_DB
        value: "false"
      - key: RUN_SEED
        value: "false"

  # Frontend Service
  - type: static
    name: workshop-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    publishDir: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://completo-backend.onrender.com
