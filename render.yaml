services:
  # Backend Service
  - type: web
    name: workshop-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && cd backend && npm install && npx prisma generate && npx prisma db push --force-reset && node prisma/seed.js
    startCommand: cd backend && node src/index.js
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: DATABASE_URL
        value: "file:./prisma/dev.db" # Usar una BD externa como Supabase/PostgreSQL en producción real
      - key: PORT
        value: 10000

  # Frontend Service
  - type: static
    name: workshop-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    publishDir: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://workshop-backend.onrender.com # Cambiar por tu URL de Render real
